name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'functions/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Write app config from repository secrets
        env:
          FIREBASE_WEB_ENV: ${{ secrets.FIREBASE_WEB_ENV }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_WEB_ENV" ]; then echo "::error::Secret FIREBASE_WEB_ENV missing (conteúdo do .env)"; exit 1; fi
          printf '%s\n' "$FIREBASE_WEB_ENV" > .env
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vanta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
